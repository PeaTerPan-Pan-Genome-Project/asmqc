# Image environment /opt/envs/core (SPEC §5.1). Locked in core.lock.
name: core
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.14
  - snakemake=9.27.0
  - pandas=2.3.3  # snakemake 9.27.0 requires pandas <3
  - matplotlib=3.11.2
  - jinja2=3.1.6
  - pyyaml=6.0.3
  - seqkit=2.14.0
  - samtools=1.24
  - bcftools=1.24
  - bedtools=2.31.1
  - mm2plus=1.3
  - blast=2.17.0
  - tidk=0.2.65
