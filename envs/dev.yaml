# Development environment: unit tests and partial workflow runs outside the
# image. Tool versions match envs/core.yaml (SPEC §5.1). Heavy tools (QUAST,
# BUSCO, Merqury, CRAQ) are only in the image.
name: asmqc-dev
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12.14
  - pip=26.2.1
  - setuptools=84.0.0
  - snakemake=9.27.0
  - pandas=2.3.3  # snakemake 9.27.0 requires pandas <3
  - matplotlib=3.11.2
  - jinja2=3.1.6
  - pyyaml=6.0.3
  - pytest=9.1.1
  - ruff=0.16.9
  - seqkit=2.14.0
  - samtools=1.24
  - bcftools=1.24
  - bedtools=2.31.1
  - mm2plus=1.3
  - blast=2.17.0
  - tidk=0.2.65
