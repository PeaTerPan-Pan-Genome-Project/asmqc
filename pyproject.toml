[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "asmqc"
version = "0.1.3"
description = "Comparable QC of chromosome-level pea genome assemblies"
license = "GPL-3.0-only"
requires-python = ">=3.12"
# Runtime dependencies are pinned in envs/*.yaml and envs/*.lock, not here.
dependencies = []

[project.scripts]
asmqc = "asmqc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# a table of prose: multi-line descriptions are implicitly concatenated strings
"src/asmqc/docs.py" = ["ISC004"]
