name: release

# Builds asmqc_<version>.sif on a pushed v* tag, runs its %test (asmqc test),
# pushes it to ghcr.io as an ORAS artifact and attaches it with its sha256 to a
# GitHub release (SPEC §10). The first versioned release needs the
# maintainers' go-ahead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check tag against pyproject version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build image (runs asmqc test)
        run: ./build.sh

      - name: Push to ghcr.io
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | apptainer registry login \
            --username "${{ github.actor }}" --password-stdin oras://ghcr.io
          apptainer push "asmqc_${VERSION}.sif" \
            "oras://ghcr.io/peaterpan-pan-genome-project/asmqc/sif:${VERSION}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "asmqc_${VERSION}.sif" "asmqc_${VERSION}.sif.sha256" \
            --title "asmqc ${VERSION}" --notes-file CHANGELOG.md
